[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auraone-sdk"
version = "1.0.0"
description = "Python SDK for AuraOne AI evaluation workflows: typed sync and async clients and the aura CLI for the hosted AuraOne API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AuraOne Team", email = "support@auraone.ai" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
keywords = [
  "auraone",
  "api",
  "sdk",
  "python",
  "ml",
  "ai",
  "training",
  "analytics",
  "collaboration",
  "quality",
  "safety",
  "llm-evaluation",
  "ai-evaluation",
]
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
async = ["aiofiles>=0.8.0"]
# P1-05: federated-learning participant client — CKKS via TenSEAL +
# ed25519 via cryptography. torch/opacus stay customer-side (too heavy to
# force on runner images).
federation = [
  "cryptography>=42.0.0",
  "tenseal==0.3.16",
]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.0.0",
  "black>=26.3.1",
  "isort>=5.12.0",
  "mypy>=1.0.0",
  "flake8>=6.0.0",
]
docs = [
  "sphinx>=6.0.0",
  "sphinx-rtd-theme>=1.3.0",
  "myst-parser>=2.0.0",
]

[project.urls]
Homepage = "https://auraone.ai/open/sdk-python"
Documentation = "https://auraone.ai/developers"
Source = "https://github.com/auraoneai/sdk-python"
Issues = "https://github.com/auraoneai/sdk-python/issues"
Changelog = "https://github.com/auraoneai/sdk-python/blob/main/CHANGELOG.md"

[project.scripts]
aura = "aura.cli:main"

[tool.setuptools.packages.find]
include = ["aura_one*", "aura*"]
exclude = ["tests", "tests.*"]
