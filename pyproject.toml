[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auraone-sdk"
version = "0.1.0"
description = "Official Python SDK and CLI for the AuraOne hosted API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "AuraOne" }]
keywords = ["auraone", "sdk", "evaluation", "ai", "human-feedback"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
async = ["httpx[http2]>=0.27.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23.0", "build>=1.0"]

[project.scripts]
aura = "aura.cli:main"

[project.urls]
Homepage = "https://www.auraone.ai/developers"
Documentation = "https://www.auraone.ai/resources/docs"
Source = "https://github.com/auraoneai/sdk-python"
Issues = "https://github.com/auraoneai/sdk-python/issues"

[tool.setuptools]
packages = ["aura_one", "aura"]
